<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FormGlut - Settings</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/antd@5.12.8/dist/reset.css" />
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.10/dayjs.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/antd@5.12.8/dist/antd.min.js"></script>
    <script src="https://unpkg.com/@ant-design/icons@5.2.6/dist/index.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; min-height: 100vh; }

        .fg-header { background: #000; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; height: 64px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.15); }
        .fg-header-logo { display: flex; align-items: center; gap: 10px; color: #fff; font-size: 22px; font-weight: 700; }
        .fg-header-logo .logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, #e94560, #c62a4a); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; }
        .fg-header-nav { display: flex; align-items: center; gap: 4px; }
        .fg-header-nav a { color: rgba(255,255,255,0.7); padding: 8px 14px; border-radius: 6px; text-decoration: none; font-size: 15px; font-weight: 500; transition: all 0.2s; }
        .fg-header-nav a:hover { color: #fff; background: rgba(255,255,255,0.1); }
        .fg-header-nav a.active { background: rgba(233,69,96,0.3); color: #fff; }
        .fg-header-search { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.15); border-radius: 8px; padding: 6px 12px; color: #fff; font-size: 14px; width: 220px; outline: none; }

        .fg-content { max-width: 1280px; margin: 0 auto; padding: 24px; display: flex; gap: 24px; }
        .fg-page-title { font-size: 24px; font-weight: 700; color: #1a1a2e; margin-bottom: 4px; }
        .fg-page-subtitle { color: #64748b; font-size: 14px; margin-bottom: 24px; }

        .fg-sidebar { width: 240px; flex-shrink: 0; }
        .fg-sidebar-card { background: #fff; border-radius: 12px; border: 1px solid #f0f0f0; overflow: hidden; }
        .fg-sidebar-item { display: flex; align-items: center; gap: 10px; padding: 12px 16px; font-size: 13px; font-weight: 500; color: #475569; cursor: pointer; transition: all 0.15s; border-left: 3px solid transparent; }
        .fg-sidebar-item:hover { background: #f8fafc; color: #1a1a2e; }
        .fg-sidebar-item.active { background: #fef2f2; color: #e94560; border-left-color: #e94560; font-weight: 600; }

        .fg-main { flex: 1; min-width: 0; }
        .fg-settings-card { background: #fff; border-radius: 12px; border: 1px solid #f0f0f0; padding: 28px; margin-bottom: 16px; }
        .fg-settings-card-title { font-size: 16px; font-weight: 700; color: #1a1a2e; margin-bottom: 4px; }
        .fg-settings-card-desc { font-size: 13px; color: #94a3b8; margin-bottom: 20px; }
        .fg-settings-row { display: flex; align-items: flex-start; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid #f5f5f5; }
        .fg-settings-row:last-child { border-bottom: none; }
        .fg-settings-row-info { flex: 1; }
        .fg-settings-row-label { font-size: 14px; font-weight: 600; color: #1a1a2e; }
        .fg-settings-row-desc { font-size: 12px; color: #94a3b8; margin-top: 3px; }
        .fg-settings-row-action { flex-shrink: 0; margin-left: 24px; }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { useState } = React;
        const { Button, Switch, Input, Select, Divider, Alert, message, Tabs, Tooltip, Tag } = antd;
        const {
            SettingOutlined, MailOutlined, LockOutlined, BellOutlined,
            GlobalOutlined, SafetyOutlined, ApiOutlined, SaveOutlined,
            CodeOutlined, CloudOutlined, KeyOutlined,
            BugOutlined, DeleteOutlined
        } = icons;

        const headerNav = [
            { label: 'Forms', href: 'all-forms.html' },
            { label: 'Entries', href: 'all-entries.html' },
            { label: 'Reports', href: 'reports.html' },
            { label: 'Payments', href: 'payments.html' },
            { label: 'Settings', href: 'settings.html', active: true },
            { label: 'Tools', href: 'tools.html' },
            { label: 'Integrations', href: 'integrations.html' },
            { label: 'Support', href: 'support.html' },
        ];

        const sidebarItems = [
            { icon: <SettingOutlined />, label: 'General', active: true },
            { icon: <MailOutlined />, label: 'Email Notifications' },
            { icon: <LockOutlined />, label: 'Security' },
            { icon: <SafetyOutlined />, label: 'Spam Protection' },
            { icon: <GlobalOutlined />, label: 'Localization' },
            { icon: <BellOutlined />, label: 'Notifications' },
            { icon: <ApiOutlined />, label: 'REST API' },
            { icon: <CodeOutlined />, label: 'Advanced' },
        ];

        function SettingRow({ label, desc, children }) {
            return (
                <div className="fg-settings-row">
                    <div className="fg-settings-row-info">
                        <div className="fg-settings-row-label">{label}</div>
                        {desc && <div className="fg-settings-row-desc">{desc}</div>}
                    </div>
                    <div className="fg-settings-row-action">{children}</div>
                </div>
            );
        }

        function App() {
            return (
                <div>
                    <header className="fg-header">
                        <div className="fg-header-logo"><div className="logo-icon">FG</div> FormGlut</div>
                        <nav className="fg-header-nav">
                            {headerNav.map(n => <a key={n.label} href={n.href} className={n.active ? 'active' : ''}>{n.label}</a>)}
                        </nav>
                        <input className="fg-header-search" placeholder="Search... (⌘K)" />
                    </header>

                    <div className="fg-content">
                        <div className="fg-sidebar">
                            <div className="fg-page-title">Settings</div>
                            <div className="fg-page-subtitle">Configure FormGlut</div>
                            <div className="fg-sidebar-card" style={{ marginTop: 8 }}>
                                {sidebarItems.map(s => (
                                    <div key={s.label} className={`fg-sidebar-item ${s.active ? 'active' : ''}`}>
                                        {s.icon} {s.label}
                                    </div>
                                ))}
                            </div>
                        </div>
                        <div className="fg-main">
                            <div className="fg-settings-card">
                                <div className="fg-settings-card-title">General Settings</div>
                                <div className="fg-settings-card-desc">Basic plugin configuration and preferences</div>
                                <SettingRow label="Plugin Language" desc="Set the language for admin interface and form messages">
                                    <Select defaultValue="en" style={{ width: 160 }} options={[
                                        { value: 'en', label: 'English' },
                                        { value: 'es', label: 'Spanish' },
                                        { value: 'fr', label: 'French' },
                                        { value: 'de', label: 'German' },
                                        { value: 'bn', label: 'Bengali' },
                                    ]} />
                                </SettingRow>
                                <SettingRow label="Date Format" desc="How dates are displayed in entries and reports">
                                    <Select defaultValue="F j, Y" style={{ width: 180 }} options={[
                                        { value: 'F j, Y', label: 'April 12, 2024' },
                                        { value: 'Y-m-d', label: '2024-04-12' },
                                        { value: 'm/d/Y', label: '04/12/2024' },
                                        { value: 'd/m/Y', label: '12/04/2024' },
                                    ]} />
                                </SettingRow>
                                <SettingRow label="Default Form Status" desc="New forms will be created with this status">
                                    <Select defaultValue="draft" style={{ width: 140 }} options={[
                                        { value: 'draft', label: 'Draft' },
                                        { value: 'published', label: 'Published' },
                                    ]} />
                                </SettingRow>
                                <SettingRow label="Delete Entry on Trash" desc="Permanently delete entries when form is deleted">
                                    <Switch defaultChecked={false} />
                                </SettingRow>
                                <SettingRow label="Enable Fluent Forms Migration" desc="Allow importing forms from Fluent Forms">
                                    <Switch defaultChecked={true} />
                                </SettingRow>
                            </div>

                            <div className="fg-settings-card">
                                <div className="fg-settings-card-title">Email Settings</div>
                                <div className="fg-settings-card-desc">Configure how notification emails are sent</div>
                                <SettingRow label="From Name" desc="Name shown in outgoing notification emails">
                                    <Input defaultValue="FormGlut" style={{ width: 200 }} />
                                </SettingRow>
                                <SettingRow label="From Email" desc="Email address used for sending notifications">
                                    <Input defaultValue="noreply@example.com" style={{ width: 240 }} />
                                </SettingRow>
                                <SettingRow label="Email Format" desc="Choose between HTML or plain text emails">
                                    <Select defaultValue="html" style={{ width: 140 }} options={[
                                        { value: 'html', label: 'HTML' },
                                        { value: 'text', label: 'Plain Text' },
                                    ]} />
                                </SettingRow>
                                <SettingRow label="SMTP" desc="Use custom SMTP server for sending emails">
                                    <Switch />
                                </SettingRow>
                            </div>

                            <div className="fg-settings-card">
                                <div className="fg-settings-card-title">Security</div>
                                <div className="fg-settings-card-desc">Protect your forms from spam and abuse</div>
                                <SettingRow label="reCAPTCHA v3" desc="Google reCAPTCHA invisible verification">
                                    <Switch />
                                </SettingRow>
                                <SettingRow label="hCaptcha" desc="Privacy-focused captcha alternative">
                                    <Switch />
                                </SettingRow>
                                <SettingRow label="Cloudflare Turnstile" desc="Smart CAPTCHA by Cloudflare">
                                    <Switch defaultChecked={true} />
                                </SettingRow>
                                <SettingRow label="Honeypot Protection" desc="Hidden field to trap spam bots">
                                    <Switch defaultChecked={true} />
                                </SettingRow>
                                <SettingRow label="Rate Limiting" desc="Limit form submissions per IP address">
                                    <Select defaultValue="5min" style={{ width: 180 }} options={[
                                        { value: 'none', label: 'No Limit' },
                                        { value: '1min', label: '1 per minute' },
                                        { value: '5min', label: '1 per 5 minutes' },
                                        { value: '1hr', label: '1 per hour' },
                                    ]} />
                                </SettingRow>
                            </div>

                            <div style={{ display: 'flex', justifyContent: 'flex-end', gap: 8, marginTop: 8 }}>
                                <Button>Reset to Defaults</Button>
                                <Button type="primary" icon={<SaveOutlined />} style={{ background: '#e94560', borderColor: '#e94560' }}>Save Settings</Button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
